services:
  - type: web
    name: washwise-api
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ISSUER
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: ADMIN_CLERK_USER_IDS
        sync: false
